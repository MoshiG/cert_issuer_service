[project]
name = "cert-issuer-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Goodiel Moshi",email = "gcmoshi@googlemail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "requests (>=2.32.5,<3.0.0)",
    "ulid-py (>=1.1.0,<2.0.0)",
    "jcs (>=0.2.1,<0.3.0)",
    "eth-account (>=0.13.7,<0.14.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "cryptography (>=45.0.6,<46.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)"
]

[tool.poetry]
packages = [{include = "cert_issuer_service", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


# Configuration for Uvicorn ASGI server - additional 
[tool.poetry.scripts]
dev = "uvicorn:main"

[tool.uvicorn]
app = "cert_issuer_service.app:app"
factory = true
host = "0.0.0.0"
port = 8080
reload = true
[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.28"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
